name: Feature Request
description: Suggest an improvement, customization option, or new compatibility feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Describe the gameplay or HUD scenario that motivated this request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature or MCM/F1 setting working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Optional workarounds or alternative designs you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context or Mockups
      description: Screenshots, UI references, or mod compatibility notes.
